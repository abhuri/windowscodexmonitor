[package]
name = "windowscodexmonitor"
version = "0.1.7"
edition = "2024"
description = "A lightweight Windows tray monitor for Codex weekly remaining usage."
license = "MIT"
repository = "https://github.com/abhuri/windowscodexmonitor"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
fontdue = "0.9.3"
font8x8 = "0.3.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
softbuffer = "0.4.6"
thiserror = "2.0.18"
tray-icon = "0.21.1"
winit = "0.30.12"
winreg = "0.55.0"
